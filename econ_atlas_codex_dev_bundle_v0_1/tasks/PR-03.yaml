id: PR-03
title: Search + responsive + accessibility
max_scope: Target <= ~800 handwritten net LOC.
work:
- Implement command/search palette using search-index.json.
- Support Cmd+K and Ctrl+K.
- Group results Questions, Topics, Charts, Indicators, Areas.
- Implement mobile Explore Sheet/drawer.
- 'Make right ContextRail responsive: sidebar on wide screens, below content on narrow screens.'
- Make chart preview grids 3/2/1 columns appropriately.
