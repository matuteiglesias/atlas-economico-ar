[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-knowledge-compiler"
version = "0.1.0"
description = "Compile normalized economic knowledge YAML into frontend-oriented site read models"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ekc = "econ_knowledge_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
