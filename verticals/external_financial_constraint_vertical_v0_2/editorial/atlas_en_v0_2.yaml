schema_version: '0.1'
entities:
  external_financial_constraint:
    title: External & Financial Constraint
    slug: external-financial-constraint
    dek: How reserves, external flows, debt obligations, market access, and the depth of domestic finance shape Argentina's
      capacity to absorb shocks and finance growth.
    intro: Argentina's external constraint is not one number. Gross reserves can rise while usable buffers remain thin; a
      trade surplus can coexist with service and interest outflows; market access can improve while refinancing needs remain
      large. This area organizes those pieces into a common reading structure, separating stocks from flows and distinguishing
      temporary financing support from durable improvements in external resilience.
    featured: true
    order: 20
  nominal_stabilization:
    title: Nominal Stabilization
    slug: nominal-stabilization
    dek: How prices, exchange rates, monetary conditions, and expectations interact during Argentina's stabilization process.
    intro: Nominal stabilization is tracked here through several connected but distinct margins — inflation momentum, the exchange
      rate and BCRA FX operations, real interest-rate conditions, and the recovery of peso money demand. The active public
      questions and charts let readers compare those margins without treating any single indicator as a complete measure of
      stabilization.
    featured: true
    order: 10
  ns.inflation:
    title: Inflation
    slug: inflation
    dek: How quickly the general level of prices is changing — and one of the central variables around which Argentina's stabilization
      process is organized.
    featured: true
  q.ns01:
    title: How fast is inflation running now, and is it accelerating or decelerating?
    slug: how-fast-is-inflation-running-now-and-is-it-accelerating-or-decelerating
    dek: Separate the current monthly inflation rate from recent momentum and longer-horizon inflation before judging whether
      the price process is speeding up or slowing down.
    intro: This page compares monthly headline CPI with three-month annualized momentum, year-over-year inflation, and the month-to-month
      change in inflation. Reading the horizons together separates the current pace from recent direction and from the slower-moving
      year-over-year measure.
  q.ns04:
    title: What is driving monthly inflation?
    slug: what-is-driving-monthly-inflation
    dek: Separate persistence from relative-price changes, demand conditions, interest rates, and exchange-rate pass-through.
  q.ns05:
    title: How much do exchange-rate movements pass through to domestic prices?
    slug: how-much-do-exchange-rate-movements-pass-through-to-domestic-prices
    dek: Compare official exchange-rate changes with monthly inflation without treating co-movement as a measured pass-through
      coefficient.
    intro: The Atlas places monthly changes in the official exchange rate beside monthly headline inflation over a recent window
      and over the period since December 2023. The comparison is useful for timing and co-movement; it does not by itself identify
      how much of an inflation move was caused by the exchange rate.
  q.ns11:
    title: How are BCRA FX purchases interacting with the exchange rate and monetary conditions?
    slug: how-are-bcra-fx-purchases-interacting-with-the-exchange-rate-and-monetary-conditions
    dek: Separate the daily flow of BCRA FX purchases from their cumulative scale and from exchange-rate or monetary outcomes.
    intro: This page follows daily and cumulative BCRA FX purchases and places them beside the official exchange rate, with
      monetary-base and money-demand measures linked as broader policy context. Compare the timing and accumulation of purchases
      with exchange-rate movements without assuming that intervention alone determines the monetary or FX outcome.
  q.ns12:
    title: Are interest rates restrictive in real terms?
    slug: are-interest-rates-restrictive-in-real-terms
    dek: Compare the nominal TAMAR rate with its ex-post real counterpart before interpreting current rate conditions.
    intro: The current public evidence compares the TAMAR nominal annual rate with an ex-post real rate constructed using realized
      inflation. Reading the two together separates the observed nominal return from its realized inflation-adjusted counterpart;
      the pair is not a complete estimate of expected real policy stance.
  q.ns15:
    title: Is domestic money demand recovering?
    slug: is-domestic-money-demand-recovering
    dek: Distinguish genuine recovery in real peso balances from nominal monetary growth that can reflect the price level.
    intro: The prominent evidence follows the real monetary base and compares nominal with real private transactional M2 since
      December 2023. Those views separate growth in peso-denominated stocks from inflation-adjusted balances, so nominal expansion
      is not mistaken for deeper monetization.
  q.ns16:
    title: Is remonetization proceeding fast enough to absorb monetary expansion without reigniting inflation?
    slug: is-remonetization-proceeding-fast-enough-to-absorb-monetary-expansion-without-reigniting-inflation
    dek: Read real money balances alongside inflation and the monetary base rather than treating a larger nominal peso stock
      as successful remonetization.
    intro: This page compares real private transactional M2 with monthly inflation and places the real monetary base beside
      real transactional M2. Together the charts keep the recovery of real money balances, the monetary base, and inflation
      distinct; they do not identify a causal threshold at which monetary expansion would reignite inflation.
  q.ns17:
    title: Is monetary-base growth consistent with the monetary-targeting framework?
    slug: is-monetary-base-growth-consistent-with-the-monetary-targeting-framework
    dek: Judge monetary-base growth together with real money-demand proxies and inflation rather than from the nominal base
      alone.
    intro: The public evidence is a compact monetization dashboard combining the real monetary base, real private transactional
      M2, and monthly inflation since December 2023. It places the operational aggregate beside a private money-demand proxy
      and inflation, but it is not a direct test against an explicit numerical policy target.
  pi.ns08:
    title: Inflation-driver decomposition
    slug: inflation-driver-decomposition
    dek: A decomposition of monthly inflation into the mechanisms that may be sustaining or slowing the price process.
  ef.gross_reserves:
    title: Gross international reserves
    dek: The headline stock of reserve assets held by the central bank.
    intro: Gross reserves are the most visible external-buffer measure, but they should not be read as if every dollar were
      equally available. Reserve requirements, swaps, repos, and other reserve-related liabilities can make the headline stock
      diverge substantially from the resources that are readily usable under stress.
  ef.net_international_reserves:
    title: Net international reserves
    dek: A net view of reserve buffers after subtracting specified reserve-related liabilities.
    intro: 'NIR is useful because it makes explicit that reserve strength depends on both assets and liabilities. The exact
      definition matters: program measures, accounting measures, and alternative liquid-reserve concepts may differ, so the
      atlas keeps the measurement convention visible rather than collapsing them into one number.'
  ef.reserve_adequacy:
    title: Reserve adequacy
    dek: Whether external buffers are large enough relative to the obligations and shocks they may need to absorb.
    intro: No single adequacy ratio is sufficient. Import coverage, near-term FX debt service, short-term liabilities, and
      the composition of reserves each answer a different question. The atlas therefore treats adequacy as a family of comparisons
      rather than a binary judgment.
  ef.current_account:
    title: Current account
    dek: The balance of goods, services, income, and transfers between Argentina and the rest of the world.
    intro: A headline current-account balance can hide very different underlying stories. A strong goods surplus may be offset
      by tourism, other services, or interest payments. Decomposing those pieces helps distinguish a durable export improvement
      from a temporary compression of imports or a change in financing conditions.
  ef.market_access:
    title: International market access
    dek: The ability to refinance and raise foreign-currency funding at terms that can be sustained over time.
    intro: A successful bond issue is evidence of access, but not necessarily of durable access. The broader question is whether
      multiple issuers can return to markets repeatedly, whether maturities lengthen, and whether spreads fall enough for
      refinancing to stop depending on exceptional official or secured financing.
  ef.sovereign_spreads:
    title: Sovereign spreads
    dek: The market premium investors demand to hold Argentine sovereign debt relative to a lower-risk benchmark.
    intro: 'Spreads compress a large amount of information into one market price: debt sustainability, policy credibility,
      global risk appetite, refinancing pressure, and expected recovery values. They are therefore valuable state indicators,
      but should not be interpreted as a clean measure of any single causal mechanism.'
  ef.fx_debt_service:
    title: Foreign-currency debt service
    dek: Principal and interest payments that must be met in foreign currency over a defined horizon.
    intro: Debt-service pressure is fundamentally a timing problem. A country can have a manageable debt ratio and still face
      a difficult year if large foreign-currency payments arrive before market access or reserve buffers are strong enough.
      Forward maturity views are therefore central to this area.
  ef.financial_depth:
    title: Financial depth
    dek: How much saving and financing the domestic financial system can intermediate relative to the economy.
    intro: Argentina combines substantial resident wealth with unusually shallow domestic credit and capital markets. That
      gap matters because a deeper local financial system can reduce dependence on volatile external financing, but rapid
      credit expansion also creates prudential risks if underwriting and borrower incomes do not keep pace.
  ef.private_credit:
    title: Private-sector credit
    dek: Domestic bank and financial-system lending to households and firms.
    intro: Credit deepening is potentially growth-enhancing in a financially shallow economy, but the speed and quality of
      expansion matter. The atlas reads credit growth together with non-performing loans, capitalization, liquidity, and the
      broader macro-financial environment.
  ef.domestic_savings_mobilization:
    title: Domestic savings mobilization
    dek: The process of bringing resident savings into domestic financial intermediation and productive investment.
    intro: Argentina's external financing constraint coexists with a large stock of resident assets held outside the domestic
      financial system. Mobilizing even part of those savings could deepen credit and capital markets, but doing so sustainably
      depends on confidence, legal certainty, macro stability, and credible financial institutions.
  q.ef01:
    title: How strong is Argentina's reserve position?
    dek: Separate gross reserves, NIR, liquid buffers, and adequacy ratios before judging external strength.
    intro: The same reserve headline can imply very different levels of resilience depending on what sits behind it. This
      question forces the reader to distinguish the accounting stock from net and liquid measures, then compare those buffers
      with the obligations they may need to cover.
  q.ef02:
    title: Are reserves rebuilding fast enough?
    dek: Compare the pace of reserve accumulation with targets and near-term foreign-currency obligations.
    intro: 'Reserve accumulation matters because time matters: rebuilding buffers slowly may still leave a difficult refinancing
      window exposed. The useful comparison is not simply whether reserves are rising, but whether they are rising quickly
      enough relative to the target path and the payment calendar ahead.'
  q.ef03:
    title: What is driving changes in reserves?
    dek: Reconcile FX purchases, debt payments, official financing, and other flows with movements in gross and net reserves.
    intro: Central-bank purchases do not translate one-for-one into reserve accumulation. Debt service, valuation changes,
      swaps, repos, and other transactions can produce large differences between the flow observed in the FX market and the
      change in reserve stocks.
  q.ef04:
    title: Is the current account improving?
    dek: Decompose the current account into goods, services, and income balances rather than relying on the headline total.
    intro: An improving current account can reflect stronger exports, weaker imports, lower service outflows, or changes in
      income payments. Those stories have different implications for sustainability, competitiveness, and growth, so the composition
      matters as much as the total.
  q.ef05:
    title: What offsets Argentina's goods surplus?
    dek: Show how services and primary-income outflows interact with the merchandise trade balance.
    intro: Argentina can run a sizeable goods surplus without generating an equally large current-account surplus. Tourism,
      other service imports, and interest or investment-income payments can absorb a substantial share of trade earnings.
  q.ef06:
    title: Are capital inflows durable?
    dek: Distinguish FDI, private financial flows, public borrowing, and temporary financing when reading the financial account.
    intro: External financing is not homogeneous. Longer-horizon direct investment, market debt, official disbursements, and
      reversals in resident hedging have different persistence and risk. The goal is to understand what kind of inflow is
      financing the external position.
  q.ef07:
    title: Has FX hedging pressure normalized?
    dek: Track private financial flows around stress episodes and compare them with the recovery in reserve buffers.
    intro: Resident demand for foreign assets can change abruptly when political or macro uncertainty rises. Looking at the
      reversal of those flows helps distinguish a genuine normalization in portfolio behavior from reserve improvement driven
      mainly by exceptional financing.
  q.ef08:
    title: Is Argentina regaining durable market access?
    dek: Read spreads, issuance volumes, issuer breadth, and maturity conditions together.
    intro: Market access is stronger when financing becomes repeatable rather than exceptional. Falling spreads matter, but
      so do the number of issuers returning to market, the tenor of new debt, and whether refinancing can occur without relying
      on temporary official facilities.
  q.ef09:
    title: Why can reserves rise while sovereign risk stays high?
    dek: Put external buffers and market pricing side by side instead of assuming they must move together.
    intro: Reserve accumulation is only one input into sovereign-risk pricing. Investors also care about the future debt-service
      schedule, fiscal and political credibility, the durability of market access, and global conditions. Divergence between
      reserves and spreads can therefore be informative rather than contradictory.
  q.ef10:
    title: How large is the near-term FX maturity wall?
    dek: Organize the next twelve months of principal and interest obligations by financing channel.
    intro: The external constraint often becomes most concrete in the maturity calendar. A forward view shows when market
      redemptions, multilateral payments, and other foreign-currency obligations cluster, and therefore when reserve and refinancing
      buffers matter most.
  q.ef11:
    title: How much does the strategy rely on swaps and repos?
    dek: Separate durable reserve accumulation from temporary or secured official external financing.
    intro: Swaps and repos can be valuable liquidity bridges, especially during a difficult refinancing window. They also
      create liabilities and future repayment needs. Reading them alongside NIR helps avoid treating borrowed liquidity as
      equivalent to permanently stronger external buffers.
  q.ef12:
    title: Is market financing broadening beyond the sovereign?
    dek: Compare public, provincial, and corporate FX issuance as Argentina re-enters credit markets.
    intro: A broadening issuer base is a stronger signal than a single successful transaction. Corporate and provincial issuance
      can reveal whether investor appetite is extending beyond the sovereign and whether access is becoming a more normal
      financing channel.
  q.ef13:
    title: Is the external debt burden becoming easier to service?
    dek: Compare debt stocks with GDP, reserves, and the forward debt-service profile.
    intro: Debt sustainability is not captured by the dollar stock alone. The burden depends on the size of the economy, export
      capacity, interest costs, maturity structure, and the buffers available when payments fall due.
  q.ef14:
    title: Is private credit genuinely deepening?
    dek: Track credit relative to GDP and in real terms, not only nominal loan growth.
    intro: In a high-inflation economy, nominal credit can grow rapidly without meaningfully deepening financial intermediation.
      Real growth and credit-to-GDP measures provide a cleaner view of whether households and firms are gaining access to
      a larger domestic financing system.
  q.ef15:
    title: Is credit quality deteriorating as lending expands?
    dek: Read real credit growth together with NPLs and bank capital rather than treating expansion as unambiguously positive.
    intro: Rapid deepening from a low base can be healthy, but it can also expose weaker borrowers or underwriting standards.
      Rising non-performing loans are therefore most informative when placed beside the pace of lending and the buffers held
      by banks.
  q.ef16:
    title: What does the rise in dollar deposits mean?
    dek: Distinguish deeper domestic intermediation from the risks created by foreign-currency balance sheets.
    intro: More FX deposits can bring resident savings into the domestic system and support financial depth. Their implications
      depend on how those funds are invested or lent, the currency exposure of borrowers, and the liquidity and capital position
      of banks.
  q.ef17:
    title: How shallow is Argentina's financial system?
    dek: Compare bank credit and domestic capital markets with the size of the economy and a transparent peer set.
    intro: Financial depth is a structural constraint behind many short-run financing problems. A shallow domestic system
      leaves firms and the public sector more dependent on cash flow, inflationary finance, or external markets, while also
      limiting the transmission of savings into investment.
  q.ef18:
    title: Could resident savings relax the external constraint?
    dek: Put assets held outside the domestic system beside the small scale of local credit and capital markets.
    intro: Argentina's scarcity of domestic financing sits beside substantial resident wealth, much of it held in foreign
      currency or outside local intermediation. The interesting question is not whether those assets exist, but what institutional
      and macro conditions would allow them to finance productive activity.
  q.ef19:
    title: How does real appreciation interact with the external balance?
    dek: Read the REER, current account, and reserve accumulation together without reducing the relationship to a single causal
      claim.
    intro: Real appreciation can support purchasing power while also changing incentives for imports, exports, and portfolio
      allocation. Its external effect depends on productivity, terms of trade, capital flows, and the policy regime, which
      is why the atlas treats it as a cross-slice relationship rather than a verdict.
  q.ef20:
    title: Are BCRA FX purchases strengthening the external position?
    dek: Connect central-bank purchases with gross reserves, NIR, debt payments, and sovereign-risk indicators.
    intro: Daily FX purchases are an important observable policy action, but the external outcome depends on what happens
      elsewhere on the balance sheet. This question follows the entire chain from intervention to reserve stocks and broader
      measures of external vulnerability.
  pi.ef01:
    title: Gross reserves, NIR, and liquid buffers
    dek: Separate headline reserve assets from net and readily usable reserve buffers.
    intro: This view is designed as an explanatory chart rather than a standalone signal. Read the series together, keep the
      stated reference frame visible, and avoid treating co-movement as causal evidence unless a separately documented methodology
      supports that interpretation.
