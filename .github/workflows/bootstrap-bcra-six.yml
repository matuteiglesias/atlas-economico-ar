name: Bootstrap BCRA six-Series expansion

on:
  push:
    branches:
      - feature/bcra-six-series-expansion

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bcra-six-series-expansion
      - name: Reassemble and expand implementation payload
        run: |
          cat bootstrap_payload.part-00 bootstrap_payload.part-01 bootstrap_payload.part-02 bootstrap_payload.part-03 bootstrap_payload.part-04 > bootstrap_payload.zip
          unzip -t bootstrap_payload.zip
          unzip -o bootstrap_payload.zip
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Run capture unit tests
        run: make test-series
      - name: Capture six authentic BCRA Series
        run: make capture-bcra-series
      - name: Validate all authentic captures
        run: make validate-series
      - name: Build complete publication
        env: {SOURCE_DATE_EPOCH: '1786828800'}
        run: make build-atlas
      - name: Verify batch freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert len(json.loads(Path('series/bcra_registry.json').read_text())['series']) == 6
          assert len(list(Path('series/snapshots/bcra').glob('*.csv'))) == 6
          stats = json.loads(Path('site-data/stats.json').read_text())
          assert stats['counts']['indicator'] == 83, stats
          assert stats['counts']['chart'] == 109, stats
          assert stats['graph']['nodes'] == 291, stats
          assert stats['plot_artifacts'] == 25, stats
          assert len(list(Path('plot-artifacts/svg').glob('*.svg'))) == 25
          assert len(list(Path('web/public/plots').glob('*.svg'))) == 25
          print('PASS: six BCRA Series -> 25 PlotArtifacts -> static Atlas')
          PY
      - name: Commit authentic evidence and deterministic publication
        run: |
          rm -f bootstrap_payload.zip bootstrap_payload.part-* .github/workflows/bootstrap-bcra-six.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize six-Series BCRA expansion"
          git push origin HEAD:feature/bcra-six-series-expansion
