name: Sync Playwright lockfile

on:
  push:
    branches:
      - test/playwright-ux-battle-test

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/playwright-ux-battle-test
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh frozen lockfile only
        working-directory: web
        run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'Lock Playwright test dependency'
          git push origin HEAD:test/playwright-ux-battle-test
