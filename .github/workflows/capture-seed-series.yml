name: Capture seed economic series

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline capture tests
        run: make test-series

      - name: Capture official provider bytes
        run: make capture-seed-series

      - name: Validate capture offline
        run: make validate-series

      - name: Upload authentic capture
        uses: actions/upload-artifact@v4
        with:
          name: authentic-seed-series
          path: |
            series/raw/
            series/snapshots/
          if-no-files-found: error
          retention-days: 30
