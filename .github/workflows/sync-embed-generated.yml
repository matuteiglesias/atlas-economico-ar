name: Sync embed generated outputs

on:
  push:
    branches:
      - feat/plot-artifact-embed-variant

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/plot-artifact-embed-variant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Rebuild canonical publication and embed projection
        env:
          SOURCE_DATE_EPOCH: '1786828800'
        run: make build-atlas
      - name: Commit generated publication state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plot-artifacts site-data web/site-data web/public/plots
          if git diff --cached --quiet; then
            echo 'Generated publication state already current.'
            exit 0
          fi
          git commit -m 'Refresh page-owned PlotArtifact embeds'
          git push origin HEAD:feat/plot-artifact-embed-variant
