name: Region firewall publication sync

on:
  push:
    branches: [feat/region-activation-firewall]
    paths:
      - ".github/workflows/region-firewall-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/region-activation-firewall
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test publication contracts
        run: make test-publication
      - name: Build canonical publication snapshot
        env: {SOURCE_DATE_EPOCH: "1786828800"}
        run: make build-atlas
      - name: Commit generated publication data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data web/site-data
          if git diff --cached --quiet; then
            echo "Canonical publication snapshot already current."
            exit 0
          fi
          git commit -m "Refresh publication snapshot for region firewall"
          git push origin HEAD:feat/region-activation-firewall
