name: Figure contract

on:
  pull_request:
    paths:
      - 'figures/**'
      - 'growth/**'
      - 'scripts/build-growth-frontier.py'
      - 'scripts/scout-bcra-frontier.py'
      - '.github/workflows/figure-contract.yml'
      - 'verticals/nominal_stabilization_vertical_v0_1/knowledge/chart_specs.yaml'
      - 'verticals/external_financial_constraint_vertical_v0_2/knowledge/chart_specs.yaml'
  push:
    branches:
      - main
    paths:
      - 'figures/**'
      - 'growth/**'
      - 'scripts/build-growth-frontier.py'
      - 'scripts/scout-bcra-frontier.py'
      - '.github/workflows/figure-contract.yml'
      - 'verticals/nominal_stabilization_vertical_v0_1/knowledge/chart_specs.yaml'
      - 'verticals/external_financial_constraint_vertical_v0_2/knowledge/chart_specs.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract dependencies
        run: python -m pip install 'PyYAML>=6.0,<7' 'Pillow>=10,<12'

      - name: Validate Figure Grammar contract
        run: python figures/validate_contract.py

      - name: Run Figure Grammar guardrail tests
        run: python -m unittest discover -s figures/tests -p 'test_*.py'

      - name: Run measurement-frontier regression tests
        run: make test-growth

      - name: Build offline measurement-frontier evidence
        run: python scripts/build-growth-frontier.py --output-dir /tmp/atlas-growth-frontier

      - name: Compile validator sources
        run: python -m compileall -q figures growth scripts/build-growth-frontier.py scripts/scout-bcra-frontier.py
