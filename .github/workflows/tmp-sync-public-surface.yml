name: Temporary public-surface sync

on:
  push:
    branches:
      - feat/public-surface-projection
    paths:
      - ".github/workflows/tmp-sync-public-surface.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/public-surface-projection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Regenerate public projection
        run: python scripts/build-publication.py --output site-data
      - name: Sync web mirror
        run: |
          rm -rf web/site-data
          cp -a site-data web/site-data
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data web/site-data
          if git diff --cached --quiet; then
            echo "Generated snapshot already current."
            exit 0
          fi
          git commit -m "Refresh public-surface generated snapshot"
          git push origin HEAD:feat/public-surface-projection
