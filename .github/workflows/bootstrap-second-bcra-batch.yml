name: Bootstrap second BCRA population batch

on:
  push:
    branches:
      - feature/bcra-second-six-series-expansion

permissions:
  contents: write

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bcra-second-six-series-expansion
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Stage second-batch production changes
        run: python scripts/bootstrap_second_bcra_batch.py

      - name: Capture six authentic BCRA Series
        run: |
          python series/capture_bcra.py \
            --only 19 --only 27 --only 28 \
            --only 44 --only 108 --only 160

      - name: Validate all twelve BCRA captures
        run: |
          python series/validate_bcra.py
          python series/validate.py
          python -m unittest discover -s series/tests -p 'test_*.py'

      - name: Validate measurement and figure layers
        run: |
          python figures/validate_contract.py
          python -m unittest discover -s figures/tests -p 'test_*.py'
          python -m unittest discover -s figures/kernel_tests -p 'test_*.py'

      - name: Build complete Atlas offline
        env: {SOURCE_DATE_EPOCH: '1786828800'}
        run: make build-atlas

      - name: Report second-batch closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('series/bcra_registry.json').read_text())
          stats = json.loads(Path('site-data/stats.json').read_text())
          manifest = json.loads(Path('plot-artifacts/manifest.json').read_text())
          print('BCRA series:', len(reg['series']))
          print('Indicators:', stats['counts']['indicator'])
          print('Charts:', stats['counts']['chart'])
          print('Graph nodes:', stats['graph']['nodes'])
          print('PlotArtifacts:', stats['plot_artifacts'])
          print('SVG:', len(list(Path('plot-artifacts/svg').glob('*.svg'))))
          print('PNG:', len(list(Path('plot-artifacts/png').glob('*.png'))))
          assert len(reg['series']) == 12
          assert manifest['artifact_count'] == 35
          assert stats['plot_artifacts'] == 35
          PY

      - name: Persist authentic evidence and downstream products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          git commit -m "Materialize second six-Series BCRA expansion"
          git push origin HEAD:feature/bcra-second-six-series-expansion
