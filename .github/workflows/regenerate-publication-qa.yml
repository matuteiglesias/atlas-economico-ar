name: Regenerate publication after visual QA

on:
  push:
    branches:
      - feature/publication-qa-hardening-v0-1

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/publication-qa-hardening-v0-1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Rebuild hardened Atlas
        env: {SOURCE_DATE_EPOCH: '1786828800'}
        run: |
          python figures/validate_publication_qa.py
          python figures/validate_contract.py
          python -m unittest discover -s figures/kernel_tests -p 'test_*.py'
          make build-atlas
      - name: Verify final visual-QA frame
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('plot-artifacts/manifest.json').read_text())
          by_intent = {item['plot_intent_id']: item for item in manifest['artifacts']}
          assert by_intent['pi.ns01']['frame_id'] == 'rf.last_18m'
          stats = json.loads(Path('site-data/stats.json').read_text())
          assert stats['plot_artifacts'] == 35
          assert stats['prominent_plot_artifacts'] == 31
          assert stats['quarantined_plot_artifacts'] == 4
          assert stats['historical_plot_artifacts'] == 2
          print('PASS: final 18-month momentum frame and publication-QA counts')
          PY
      - name: Persist regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/regenerate-publication-qa.yml'
          git commit -m "Regenerate publication after visual QA"
          git push origin HEAD:feature/publication-qa-hardening-v0-1
