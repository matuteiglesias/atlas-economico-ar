name: Atlas publication

on:
  pull_request:
    paths:
      - "figures/**"
      - "series/**"
      - "publication/**"
      - "scripts/build-publication.py"
      - "plot-artifacts/**"
      - "site-data/**"
      - "verticals/**/knowledge/*.yaml"
      - "verticals/**/validation/**"
      - "web/**"
      - "Makefile"
      - ".github/workflows/publication.yml"
  push:
    branches: [main]
    paths:
      - "figures/**"
      - "series/**"
      - "publication/**"
      - "scripts/build-publication.py"
      - "plot-artifacts/**"
      - "site-data/**"
      - "verticals/**/knowledge/*.yaml"
      - "verticals/**/validation/**"
      - "web/**"
      - "Makefile"
      - ".github/workflows/publication.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Validate publication QA policy
        run: python figures/validate_publication_qa.py
      - name: Validate figure curation ledger
        run: make validate-figure-curation
      - name: Test figure curation
        run: make test-figures
      - name: Test publication contracts
        run: make test-publication
      - name: Build complete offline Atlas publication
        env: {SOURCE_DATE_EPOCH: "1786828800"}
        run: make build-atlas
      - name: Verify publication freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stats = json.loads(Path('site-data/stats.json').read_text())
          manifest = json.loads(Path('site-data/manifest.json').read_text())
          plot_ledger = json.loads(Path('site-data/plot-publication.json').read_text())
          surface = json.loads(Path('site-data/public-surface.json').read_text())
          search = json.loads(Path('site-data/search-index.json').read_text())
          navigation = json.loads(Path('site-data/navigation.json').read_text())

          assert stats['counts']['topic'] == 73, stats
          assert stats['counts']['indicator'] == 113, stats
          assert stats['counts']['chart'] == 143, stats
          assert stats['graph']['nodes'] == 385, stats
          assert stats['verticals_loaded'] == 3, stats
          assert stats['questionPublication']['semantic'] == 50, stats
          assert stats['counts']['question'] == stats['questionPublication']['public'], stats
          assert stats['questionPublication']['public'] == 15, stats
          assert manifest['questionPublication'] == stats['questionPublication'], manifest

          assert surface['semanticCounts'] == {
              'region': 6,
              'topic': 73,
              'question': 50,
              'indicator': 113,
              'chart': 143,
          }, surface
          assert surface['addressableCounts'] == {
              'region': 6,
              'topic': 55,
              'question': 15,
              'indicator': 90,
              'chart': 41,
          }, surface
          assert surface['discoverableCounts'] == {
              'region': 2,
              'topic': 55,
              'question': 15,
              'indicator': 90,
              'chart': 22,
          }, surface
          assert surface['activationBlockedCounts'] == {
              'region': 0,
              'topic': 18,
              'question': 12,
              'indicator': 23,
              'chart': 24,
          }, surface

          re_children = [
              item for item in surface['entities']
              if item['owningRegionId'] == 'real_economy' and item['kind'] != 'region'
          ]
          assert len(re_children) == 77, len(re_children)
          assert all(item['activationBlocked'] for item in re_children), re_children
          assert all(not item['addressable'] and not item['discoverable'] and not item['prominent'] for item in re_children), re_children
          assert not [item for item in search if item.get('regionId') == 'real_economy'], search
          assert 'real_economy' not in {item['id'] for item in navigation['regions']}, navigation

          assert stats['plot_artifacts'] == 41, stats
          assert manifest['plotArtifacts'] == 41, manifest
          assert plot_ledger['summary']['plotArtifactCount'] == 41, plot_ledger
          assert stats['plotPublication'] == plot_ledger['summary'], stats
          assert manifest['plotPublication'] == plot_ledger['summary'], manifest
          assert stats['prominent_plot_artifacts'] == plot_ledger['summary']['prominentCount'], stats
          assert stats['quarantined_plot_artifacts'] == plot_ledger['summary']['stateCounts']['QUARANTINE'], stats
          assert stats['historical_plot_artifacts'] == plot_ledger['summary']['stateCounts']['HISTORICAL'], stats
          assert stats['publicSurface']['chartCensus'] == {
              'semantic': 143,
              'materialized': 41,
              'addressable': 41,
              'discoverable': 22,
          }, stats
          assert len(list(Path('web/public/plots').glob('*.svg'))) == 41
          assert len(list(Path('web/public/plots').glob('*.png'))) == 41
          print(
              'PASS: 3 semantic verticals, 73 topics, 50 questions, 113 indicators, 143 charts; '
              '77 Real Economy children activation-blocked; 41 PlotArtifacts; '
              f"{stats['questionPublication']['public']} public questions; "
              f"{plot_ledger['summary']['prominentCount']} prominent / "
              f"{plot_ledger['summary']['primaryEvidenceCount']} primary evidence"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-publication-v0.2-preview
          path: |
            plot-artifacts/
            site-data/
            web/site-data/
            web/public/plots/
          if-no-files-found: error
          retention-days: 30
