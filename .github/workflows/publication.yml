name: Atlas publication

on:
  pull_request:
    paths:
      - "figures/**"
      - "series/**"
      - "scripts/build-publication.py"
      - "plot-artifacts/**"
      - "site-data/**"
      - "verticals/**/knowledge/*_v0_2.yaml"
      - "web/**"
      - "Makefile"
      - ".github/workflows/publication.yml"
  push:
    branches: [main]
    paths:
      - "figures/**"
      - "series/**"
      - "scripts/build-publication.py"
      - "plot-artifacts/**"
      - "site-data/**"
      - "verticals/**/knowledge/*_v0_2.yaml"
      - "web/**"
      - "Makefile"
      - ".github/workflows/publication.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Validate publication QA policy
        run: python figures/validate_publication_qa.py
      - name: Build complete offline Atlas publication
        env: {SOURCE_DATE_EPOCH: "1786828800"}
        run: make build-atlas
      - name: Verify publication freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stats = json.loads(Path('site-data/stats.json').read_text())
          manifest = json.loads(Path('site-data/manifest.json').read_text())
          assert stats['counts']['indicator'] == 83, stats
          assert stats['counts']['chart'] == 115, stats
          assert stats['graph']['nodes'] == 297, stats
          assert stats['plot_artifacts'] == 35, stats
          assert stats['prominent_plot_artifacts'] == 31, stats
          assert stats['quarantined_plot_artifacts'] == 4, stats
          assert stats['historical_plot_artifacts'] == 2, stats
          assert manifest['plotArtifacts'] == 35, manifest
          assert manifest['prominentPlotArtifacts'] == 31, manifest
          assert manifest['quarantinedPlotArtifacts'] == 4, manifest
          assert manifest['historicalPlotArtifacts'] == 2, manifest
          assert len(list(Path('web/public/plots').glob('*.svg'))) == 35
          assert len(list(Path('web/public/plots').glob('*.png'))) == 35
          print('PASS: 115 charts, 83 indicators, 35 PlotArtifacts; 31 prominent / 4 quarantined / 2 historical')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-publication-v0.2-preview
          path: |
            plot-artifacts/
            site-data/
            web/site-data/
            web/public/plots/
          if-no-files-found: error
          retention-days: 30
