name: Atlas publication

on:
  pull_request:
    paths:
      - "figures/**"
      - "series/**"
      - "scripts/build-publication.py"
      - "plot-artifacts/**"
      - "site-data/**"
      - "verticals/**/knowledge/plot_intents_v0_2.yaml"
      - "web/**"
      - "Makefile"
      - ".github/workflows/publication.yml"
  push:
    branches:
      - main
    paths:
      - "figures/**"
      - "series/**"
      - "scripts/build-publication.py"
      - "plot-artifacts/**"
      - "site-data/**"
      - "verticals/**/knowledge/plot_intents_v0_2.yaml"
      - "web/**"
      - "Makefile"
      - ".github/workflows/publication.yml"

permissions:
  contents: write

concurrency:
  group: atlas-publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build complete offline Atlas publication
        env:
          SOURCE_DATE_EPOCH: "1786828800"
        run: make build-atlas

      - name: Verify Phase 4 freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path('site-data/stats.json').read_text())
          manifest = json.loads(Path('site-data/manifest.json').read_text())
          assert stats['counts']['chart'] == 99, stats
          assert stats['graph']['nodes'] == 280, stats
          assert stats['graph']['edges'] == 613, stats
          assert stats['plot_artifacts'] == 3, stats
          assert manifest['plotArtifacts'] == 3, manifest
          assert manifest['publicationSchemaVersion'] == '0.2', manifest
          assert len(list(Path('web/public/plots').glob('*.svg'))) == 3
          assert len(list(Path('web/public/plots').glob('*.png'))) == 3
          print('PASS: 99 charts, 3 published PlotArtifacts, static web bundle complete')
          PY

      - name: Persist deterministic publication snapshot
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plot-artifacts site-data web/site-data web/public/plots
          if ! git diff --cached --quiet; then
            git commit -m "Update static publication snapshot"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload publication preview
        uses: actions/upload-artifact@v4
        with:
          name: atlas-publication-v0.2-preview
          path: |
            plot-artifacts/
            site-data/
            web/site-data/
            web/public/plots/
          if-no-files-found: error
          retention-days: 30
