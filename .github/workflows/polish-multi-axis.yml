name: Polish multi-axis figure palette

on:
  push:
    branches:
      - feature/bcra-six-series-expansion

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/bcra-six-series-expansion
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'PyYAML>=6.0,<7' 'matplotlib>=3.8,<4'
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.1}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Apply palette polish
        run: python scripts/apply_palette_polish.py
      - name: Run figure tests
        run: |
          python figures/validate_contract.py
          python -m unittest discover -s figures/tests -p 'test_*.py'
          python -m unittest discover -s figures/kernel_tests -p 'test_*.py'
      - name: Rebuild static Atlas
        env: {SOURCE_DATE_EPOCH: '1786828800'}
        run: make build-atlas
      - name: Persist renderer polish
        run: |
          rm scripts/apply_palette_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          git commit -m "Keep multi-axis figure series visually distinct"
          git push origin HEAD:feature/bcra-six-series-expansion
