overlay_id: "structural_transformation"
title: "Structural Transformation"
status: "global_cross_cutting_overlay"
purpose: "Represent slow-moving structural mechanisms that connect multiple slices without becoming a seventh silo."
anchor_domains:
  - "productivity"
  - "investment"
  - "trade openness"
  - "financial depth"
  - "formalization"
  - "sectoral reallocation"
  - "regional reallocation"
  - "infrastructure"
  - "governance/institutions"
  - "strategic primary sectors: agriculture, energy, mining"
  - "knowledge economy"
typical_cross_slice_paths:
  - "trade openness → sectoral reallocation → productivity → growth → employment"
  - "primary-export boom → FX inflows → reserves + real appreciation → competitiveness tradeoff"
  - "financial deepening → credit → investment/consumption → growth, with financial-stability constraints"
  - "formalization → labor income + social contributions → pensions/fiscal capacity + welfare"
  - "infrastructure/logistics → costs of doing business → investment/trade/productivity"
  - "institutional credibility → investment/market access → growth/external resilience"
rule: "Overlay objects must reference at least two slice regions or represent a global structural driver."
