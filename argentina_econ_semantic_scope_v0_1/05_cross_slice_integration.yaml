integration_pass_after_slices:
  purpose:
    - "identify missing bridge concepts/relations"
    - "merge duplicates"
    - "resolve conflicting definitions"
    - "create cross-region QuestionIntents"
    - "create cross-region PlotIntents"
    - "audit global coverage and redundancy"
  must_not:
    - "regenerate slices from scratch"
    - "erase provenance"
    - "promote agenda links to causality"
