epistemic_classes:
  OBSERVED: "Externally observed or sourced facts/artifacts."
  CURATED: "Human/agent-authored semantic or editorial knowledge approved into the graph."
  DERIVED: "Computed or normalized from other objects using an explicit procedure."
  MATERIALIZED: "Rendered/generated outputs from stable specs and data."
  OPERATIONAL: "Runtime health/status and pipeline state; never product/economic truth."
data_classes:
  - class: "MediaObservation"
    epistemic: "OBSERVED"
    population: "100k+ and growing"
  - class: "Article"
    epistemic: "DERIVED"
    population: "~55k already; growing"
  - class: "Claim"
    epistemic: "DERIVED"
    population: "10k-100k+ eventual"
  - class: "EconomicStory"
    epistemic: "DERIVED/CURATED"
    population: "1k-5k historical"
  - class: "EconomicRelease"
    epistemic: "OBSERVED"
    population: "100s-1000s"
  - class: "Concept"
    epistemic: "CURATED"
    population: "50-120"
  - class: "Relation"
    epistemic: "CURATED"
    population: "150-400"
  - class: "QuestionIntent"
    epistemic: "CURATED"
    population: "50-120"
  - class: "ReferenceFrame"
    epistemic: "CURATED"
    population: "20-50"
  - class: "CanonicalIndicator"
    epistemic: "CURATED"
    population: "100-250"
  - class: "Series"
    epistemic: "OBSERVED/REGISTERED"
    population: "300-1000"
  - class: "DerivedIndicator"
    epistemic: "DERIVED/CURATED"
    population: "30-150"
  - class: "ChartTemplate"
    epistemic: "CURATED"
    population: "8-20 global"
  - class: "PlotIntent"
    epistemic: "CURATED"
    population: "200-400 candidates"
  - class: "ChartSpec"
    epistemic: "CURATED/EXECUTABLE"
    population: "150-300 after curation"
  - class: "PlotArtifact"
    epistemic: "MATERIALIZED"
    population: "1k-10k+ and growing"
  - class: "Collection"
    epistemic: "CURATED"
    population: "10-30"
relation_types_allowed:
  - "definition"
  - "component_of"
  - "measurement_of"
  - "derived_from"
  - "accounting_relation"
  - "comparison"
  - "historical_comparison"
  - "geographic_breakdown"
  - "distribution_of"
  - "economic_mechanism"
  - "agenda_related"
  - "policy_tradeoff"
  - "constraint_on"
  - "enables"
  - "contributes_to"
  - "associated_with"
relation_rules:
  - "Every Relation must have a typed relation_type."
  - "Avoid generic related_to."
  - "economic_mechanism is not equivalent to established causality."
  - "agenda_related means public-discourse co-occurrence/association only."
  - "definition, accounting_relation, and measurement_of should be preferred when structurally correct."
  - "Relations may carry epistemic_status, provenance, confidence, and temporal_scope."
global_fields_required_on_curated_objects:
  - "id"
  - "version"
  - "status"
  - "epistemic_class"
  - "provenance"
  - "created_at"
  - "updated_at"
  - "review_state"
