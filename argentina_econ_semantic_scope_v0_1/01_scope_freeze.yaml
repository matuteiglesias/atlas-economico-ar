bundle_id: "argentina_econ_semantic_scope"
version: "0.1"
status: "scope_frozen"
purpose: "Shared semantic reference for all slice vertical builds."
regions:
  - "nominal_stabilization"
  - "external_financial_constraint"
  - "real_economy"
  - "labor_incomes"
  - "household_welfare"
  - "fiscal_regime"
global_overlays:
  - "structural_transformation"
target_curated_scale:
  concepts: "50-120"
  relations: "150-400"
  question_intents: "50-120"
  reference_frames: "20-50"
  canonical_indicators: "100-250"
  series_registrations: "300-1000"
  derived_indicators: "30-150"
  chart_templates_global: "8-20"
  plot_intents: "200-400"
  chart_specs: "150-300 after curation"
  collections: "10-30"
  gold100: "~100 selected PlotIntents"
  total_curated_knowledge_objects: "~700-1500, with ~1000 as central expectation"
per_slice_target:
  concepts: "15-25"
  relations: "30-60"
  question_intents: "10-20"
  canonical_indicators: "25-45"
  series_registrations: "40-100"
  derived_indicators: "5-15"
  plot_intents: "30-60"
  chart_specs: "20-40 only after semantic/measurement review"
  note: "Do not force exact counts; coherence beats quota."
freeze_invariants:
  - "Six bounded macro/social regions are authoritative for vertical construction."
  - "Structural transformation is a global overlay, not an independent seventh vertical."
  - "Cross-region concepts are represented as ports; slices must not silently absorb neighboring scopes."
  - "Concepts are not API series."
  - "CanonicalIndicators are stable editorial measurements; Series are technical implementations."
  - "Agenda-related relations must not be promoted to causal mechanisms."
  - "Derived indicators require explicit methodology and provenance."
  - "PlotIntent is the durable intellectual chart object; ChartSpec is executable rendering configuration."
  - "Gold100 is a Collection/curation state, not a separate ontology class."
